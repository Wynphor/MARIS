[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmodel-engine"
version = "2.0.0"
description = "数学建模竞赛全流程自动化后端"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn>=0.42,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-multipart>=0.0.18",
    "aiofiles>=24.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.0,<2.0",
    "sqlmodel>=0.0.38,<1.0",
    "pandas>=2.0,<4.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
mathmodel = "cli.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
